[pytest]
# Pytest configuration for RAY

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    adversarial: Adversarial security tests
    slow: Slow-running tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage (when running with --cov)
[coverage:run]
source = services,config,ai,ml,simulator,optimizer,policy,integrations,evaluation,audit
omit =
    */tests/*
    */__pycache__/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
